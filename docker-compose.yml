services:
  mongo:
    image: mongo:7
    container_name: appsalud-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  users-service:
    build: ./users-service
    container_name: appsalud-users
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/appsalud_users
      JWT_SECRET: ${JWT_SECRET:-clave_de_desarrollo}
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy

  estudios-service:
    build: ./estudios-service
    container_name: appsalud-estudios
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/appsalud_estudios
      JWT_SECRET: ${JWT_SECRET:-clave_de_desarrollo}
    ports:
      - "3002:3002"
    depends_on:
      mongo:
        condition: service_healthy

  recetas-service:
    build: ./recetas-service
    container_name: appsalud-recetas
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/appsalud_recetas
    ports:
      - "3003:3003"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: appsalud-frontend
    ports:
      - "5173:80"
    depends_on:
      - users-service
      - estudios-service
      - recetas-service

  # Carga los datos de ejemplo. No arranca con `up`: se corre a mano con
  # docker compose run --rm seed
  seed:
    build: ./seed
    profiles: ["seed"]
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
