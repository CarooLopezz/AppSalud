# Puerta de entrada de AppSalud: todo pasa por HTTPS.
# Así la contraseña del login (y el token) viajan cifrados y no se ven con Wireshark.

# HTTP: solo redirige a HTTPS
server {
  listen 80;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;

  # Certificado autofirmado generado al arrancar (ver generar-certificado.sh)
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # El navegador recuerda que este sitio va solo por HTTPS
  add_header Strict-Transport-Security "max-age=31536000" always;

  root /usr/share/nginx/html;
  index index.html;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  # La barra final de proxy_pass quita el prefijo: /api/users/auth/login -> /auth/login
  location /api/users/ {
    proxy_pass http://users-service:3001/;
  }

  location /api/estudios/ {
    proxy_pass http://estudios-service:3002/;
  }

  location /api/recetas/ {
    proxy_pass http://recetas-service:3003/;
  }

  # SPA: cualquier ruta de react-router devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
